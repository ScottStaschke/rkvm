name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libevdev-dev clang

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  windows-client:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Windows service and client
        run: >-
          cargo build --release
          --package rkvm-client
          --features windows-service
          --package rkvm-certificate-gen

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/rkvm-windows -Force
          Copy-Item target/release/rkvm-client.exe dist/rkvm-windows/
          Copy-Item target/release/rkvm-service.exe dist/rkvm-windows/
          Copy-Item target/release/rkvm-certificate-gen.exe dist/rkvm-windows/
          Copy-Item windows-service/install.bat dist/rkvm-windows/
          Copy-Item windows-service/uninstall.bat dist/rkvm-windows/
          Copy-Item example/client.toml dist/rkvm-windows/client.toml.example
          Copy-Item WINDOWS.md dist/rkvm-windows/
          Compress-Archive `
            -Path dist/rkvm-windows/* `
            -DestinationPath dist/rkvm-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkvm-windows-x86_64
          path: dist/rkvm-windows-x86_64.zip

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.ref == 'refs/heads/master' &&
        github.event.head_commit.message == 'Release v0.6.1-windows.1'
      )
    needs:
      - ubuntu
      - windows-client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rkvm-windows-x86_64
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ github.ref_type == 'tag' &&
                github.ref_name ||
                'v0.6.1-windows.1' }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: dist/rkvm-windows-x86_64.zip
